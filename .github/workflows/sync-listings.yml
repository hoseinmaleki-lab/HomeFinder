name: Sync approved listing feeds
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: homefinder-listing-sync
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import permitted feeds
        env:
          HOMEFINDER_FEEDS_JSON: ${{ secrets.HOMEFINDER_FEEDS_JSON }}
        run: python3 scripts/sync_listings.py
      - name: Validate imported listing data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('docs/data/listings.json').read_text())
          assert isinstance(data,list)
          for item in data:
              assert item['sqft']>3000
              assert item['url'].startswith('https://')
          print('Validated',len(data),'public listing records')
          PY
      - name: Commit new inventory when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/listings.json docs/data/feeds_status.json 2>/dev/null || git add docs/data/listings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified listing feed inventory"
            git push
          fi
