name: Validate HomeFinder
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and listing schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          listings=json.loads(Path('docs/data/listings.json').read_text())
          sources=json.loads(Path('docs/data/sources.json').read_text())
          assert isinstance(listings,list) and isinstance(sources,list)
          for x in listings:
              assert isinstance(x,dict) and isinstance(x.get('sqft'),(int,float))
              assert x['sqft']>3000
              assert x.get('url','').startswith('https://')
          print('Validated',len(listings),'listings and',len(sources),'sources')
          PY
